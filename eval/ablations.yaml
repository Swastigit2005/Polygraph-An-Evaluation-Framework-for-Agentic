# Each config is a set of Settings overrides (field names from src/rag_agent/config.py).
# Anything not listed comes from the environment / .env (models, top_k, ...).
configs:
  baseline:
    description: Dense retrieval only, no reranker, no reflection (generate straight after retrieval)
    retrieval_mode: dense
    use_reranker: false
    use_reflection: false
  hybrid:
    description: BM25 + dense fused with RRF, no reranker, no reflection
    retrieval_mode: hybrid
    use_reranker: false
    use_reflection: false
  hybrid_rerank:
    description: Hybrid + cross-encoder rerank, no reflection
    retrieval_mode: hybrid
    use_reranker: true
    use_reflection: false
  full:
    description: Hybrid + rerank + grader / rewrite loop / refuse node
    retrieval_mode: hybrid
    use_reranker: true
    use_reflection: true
    max_rewrites: 2
