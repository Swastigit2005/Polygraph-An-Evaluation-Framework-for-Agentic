[project]
name = "agentic-rag-evals"
version = "0.1.0"
description = "Self-reflective agentic RAG over Docker docs, with an evaluation harness for the agent's decisions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Runtime dependencies are pinned in requirements.txt (also used by Hugging Face Spaces).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
